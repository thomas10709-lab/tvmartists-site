name: Deploy Sanderling site

# Uploads michael-sanderling/personal/ by FTP over TLS (FTPS) to the web server of michaelsanderling.de
# (separate hosting package without SSH) after every merge to main that touches that folder.
#
# Secrets (Settings > Secrets and variables > Actions); without them the run is skipped:
#   SANDERLING_FTP_HOST      FTP server, e.g. w01c2840.kasserver.com
#   SANDERLING_FTP_USER      FTP user (best: a dedicated FTP user that can only see the folder michaelsanderling.de)
#   SANDERLING_FTP_PASSWORD  its password
#   SANDERLING_FTP_PATH      (optional) target folder on the FTP server, default "/"
#
# Nothing is ever deleted on the server: files that exist only there (images/concert-hall.mp4, ...) stay untouched.
on:
  push:
    branches: [main]
    paths:
      - 'michael-sanderling/personal/**'
      - '.github/workflows/deploy-sanderling.yml'
  workflow_dispatch:

concurrency:
  group: deploy-sanderling
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload to the Sanderling server (FTPS)
        env:
          FTP_HOST: ${{ secrets.SANDERLING_FTP_HOST }}
          FTP_USER: ${{ secrets.SANDERLING_FTP_USER }}
          FTP_PASS: ${{ secrets.SANDERLING_FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.SANDERLING_FTP_PATH }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "Sanderling FTP secrets are missing - run skipped."
            exit 0
          fi
          REMOTE="${FTP_PATH:-/}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set net:max-retries 3
          set net:timeout 30
          mirror --reverse --parallel=3 --no-perms --verbose michael-sanderling/personal "$REMOTE"
          bye
          LFTP
