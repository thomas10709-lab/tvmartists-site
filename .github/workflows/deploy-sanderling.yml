name: Deploy Sanderling site

# Copies michael-sanderling/personal/ to the web server of michaelsanderling.de (separate hosting package)
# after every merge to main that touches that folder.
# Secrets (Settings > Secrets and variables > Actions); without them the run is skipped:
#   SANDERLING_HOST         server name, e.g. w0123456.kasserver.com
#   SANDERLING_USER         SSH user
#   SANDERLING_SSH_KEY      private SSH key (ed25519)
#   SANDERLING_KNOWN_HOSTS  output of: ssh-keyscan <host>
#   SANDERLING_PATH         target folder on the server, e.g. /www/htdocs/w0123456/michaelsanderling.de/
# Files that exist only on the server (images/concert-hall.mp4, news-data symlink, ...) are never deleted.
on:
  push:
    branches: [main]
    paths:
      - 'michael-sanderling/personal/**'
      - '.github/workflows/deploy-sanderling.yml'
  workflow_dispatch:

concurrency:
  group: deploy-sanderling
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload to the Sanderling server
        env:
          HOST: ${{ secrets.SANDERLING_HOST }}
          USER_NAME: ${{ secrets.SANDERLING_USER }}
          KEY: ${{ secrets.SANDERLING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SANDERLING_KNOWN_HOSTS }}
          TARGET: ${{ secrets.SANDERLING_PATH }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER_NAME" ] || [ -z "$KEY" ] || [ -z "$KNOWN_HOSTS" ] || [ -z "$TARGET" ]; then
            echo "Sanderling deploy secrets are missing - run skipped."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rltz --no-perms --chmod=D755,F644 \
            -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            michael-sanderling/personal/ "$USER_NAME@$HOST:$TARGET"
