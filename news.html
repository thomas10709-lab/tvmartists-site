<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News | TVM artists</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="description" content="News from TVM artists – all news for one of our artists in one place.">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600&display=swap');
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            background-color: #1F4270;
            color: #ffffff;
            font-family: 'Raleway', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        .news-page { max-width: 820px; margin: 0 auto; padding: 56px 20px 30px; }
        .back-link { display: inline-block; color: #cfe3f5; font-size: 14px; letter-spacing: 0.03em; text-decoration: none; margin-bottom: 26px; }
        .back-link:hover { text-decoration: underline; }
        h1 { font-weight: 300; font-size: clamp(30px, 5vw, 46px); letter-spacing: 0.04em; margin: 0 0 6px; }
        .sub { font-weight: 300; font-size: 18px; letter-spacing: 0.06em; color: #cfe3f5; margin: 0 0 40px; }
        .news-entry { display: flex; align-items: stretch; background: #f4f7f9; color: #2C3E50; border-radius: 8px; overflow: hidden; margin: 0 0 18px; }
        .news-entry a.img-link { flex: 0 0 220px; position: relative; display: block; min-height: 150px; }
        .news-entry picture { display: block; position: absolute; inset: 0; }
        .news-entry img { display: block; width: 100%; height: 100%; object-fit: cover; }
        .news-body { flex: 1; min-width: 0; padding: 16px 20px 18px; }
        .news-date { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #6b7c8c; margin: 0 0 8px; }
        .news-title { font-size: 21px; font-weight: 600; line-height: 1.3; margin: 0 0 10px; }
        .news-text { font-size: 15px; line-height: 1.65; margin: 0 0 12px; white-space: pre-line; }
        .news-foot { font-size: 13px; display: flex; gap: 14px; justify-content: space-between; flex-wrap: wrap; }
        .news-src { font-weight: 600; }
        .news-entry a.more { color: #1d63c1; text-decoration: underline; }
        @media (max-width: 600px) {
            .news-entry a.img-link { flex-basis: 108px; min-height: 120px; }
            .news-body { padding: 12px 14px 14px; }
            .news-title { font-size: 17px; }
            .news-text { font-size: 14px; line-height: 1.55; }
        }
        .empty { text-align: center; padding: 30px 0; color: #cfe3f5; font-weight: 300; }
        .site-footer { width: 100%; text-align: center; padding: 30px 20px 40px; box-sizing: border-box; }
        .footer-rule { width: min(220px, 60vw); height: 1px; margin: 0 auto 40px; background: rgba(255,255,255,0.85); }
        .footer-insta { display: inline-block; line-height: 0; margin-bottom: 28px; transition: opacity 0.25s ease; }
        .footer-insta:hover { opacity: 0.7; }
        .footer-insta img { width: 34px; height: 34px; display: block; }
        .footer-logo-link { display: block; width: 120px; margin: 0 auto 30px; line-height: 0; transition: opacity 0.25s ease; }
        .footer-logo-link:hover { opacity: 0.7; }
        .footer-logo { display: block; width: 100%; height: auto; }
        .footer-copy { font-family: 'Raleway', sans-serif; font-weight: 300; font-size: 13px; letter-spacing: 0.04em; color: rgba(255,255,255,0.9); margin: 0; }
        .footer-copy a { color: rgba(255,255,255,0.9); text-decoration: none; transition: opacity 0.25s ease; }
        .footer-copy a:hover { opacity: 0.7; text-decoration: underline; }
    </style>
    <script src="bg-sync.js?v=2"></script>
    <style>
        /* Hintergrund wandert wie auf den Künstlerseiten durch die Farbtöne (synchron über bg-sync.js) */
        body { position: relative; min-height: 100vh; }
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
            background-color: #17355E;
            animation: bg-breathe 60s ease-in-out infinite;
            animation-delay: var(--bg-delay, 0s);
        }
        @keyframes bg-breathe {
            0%, 100% { background-color: #17355E; }
            25%      { background-color: #2B6C9C; }
            50%      { background-color: #6E78AC; }
            75%      { background-color: #43285A; }
        }
        @media (prefers-reduced-motion: reduce) {
            body::before { animation: none; }
        }
    </style>
</head>
<body>
    <main class="news-page">
        <a class="back-link" id="backLink" href="index.html">&larr; TVM artists</a>
        <h1 id="pageTitle">News</h1>
        <p class="sub" id="pageSub"></p>
        <div id="newsList"></div>
    </main>
    <footer class="site-footer">
        <div class="footer-rule"></div>
        <a href="https://www.instagram.com/tvm.artists" class="footer-insta" target="_blank" rel="noopener" aria-label="TVM artists on Instagram">
            <img src="images/insta.png" alt="Instagram">
        </a>
        <a href="https://tvmartists.com/" class="footer-logo-link" aria-label="TVM artists"><img src="images/footer-logo.png" alt="TVM artists" class="footer-logo" loading="lazy"></a>
        <p class="footer-copy">&copy; 2026 TVM artists &ndash; <a href="imprint.html">imprint</a> &ndash; <a href="imprint.html#cookies">cookie policy</a></p>
    </footer>
    <script>
    (function () {
        "use strict";
        var ARTISTS = {
            "mats-thiersch": ["Mats Thiersch", "mats-thiersch.html"],
            "gerald-karni": ["Gerald Karni", "gerald-karni.html"],
            "francesco-cagnasso": ["Francesco Cagnasso", "francesco-cagnasso.html"],
            "johannes-pierre-bettac": ["Johannes Pierre Bettac", "johannes-pierre-bettac.html"],
            "jose-luis-gutierrez": ["José Luis Gutiérrez", "jose-luis-gutierrez.html"],
            "michael-sanderling": ["Michael Sanderling", "michael-sanderling.html"]
        };
        var key = new URLSearchParams(location.search).get("artist") || "";
        var list = document.getElementById("newsList");
        function el(tag, cls, text) {
            var n = document.createElement(tag);
            if (cls) { n.className = cls; }
            if (text) { n.textContent = text; }
            return n;
        }
        function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }
        function fmtDate(ts) {
            var d = new Date(ts);
            if (isNaN(d)) { return ""; }
            return d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
        }
        function picture(it) {
            var img = document.createElement("img");
            img.src = it.image; img.alt = it.alt || it.title || "News"; img.loading = "lazy";
            if (it.w && it.h) { img.width = it.w; img.height = it.h; }
            if (!it.webp) { return img; }
            var pic = document.createElement("picture"), s = document.createElement("source");
            s.type = "image/webp"; s.srcset = it.webp;
            pic.appendChild(s); pic.appendChild(img);
            return pic;
        }
        function excerpt(t) {
            t = String(t || "").replace(/\s+/g, " ").trim();
            return t.length > 220 ? t.slice(0, 220).replace(/\s+\S*$/, "") + "\u2026" : t;
        }
        function entry(it) {
            var url = "news-article.php?id=" + encodeURIComponent(it.id);
            var box = el("article", "news-entry");
            if (it.image) {
                var a = el("a", "img-link"); a.href = url;
                a.appendChild(picture(it)); box.appendChild(a);
            }
            var body = el("div", "news-body");
            var date = fmtDate(it.ts);
            if (date) { body.appendChild(el("p", "news-date", date)); }
            var h = el("h2", "news-title"); var ta = el("a", "", it.title || it.alt || "News"); ta.href = url; ta.style.color = "inherit"; ta.style.textDecoration = "none";
            h.appendChild(ta); body.appendChild(h);
            if (it.text) { body.appendChild(el("p", "news-text", excerpt(it.text))); }
            var foot = el("div", "news-foot"); foot.appendChild(el("span", "news-src", ""));
            var m = el("a", "more", "Read more"); m.href = url; foot.appendChild(m);
            body.appendChild(foot);
            box.appendChild(body);
            return box;
        }
        if (!ARTISTS[key]) {
            document.getElementById("pageSub").textContent = "Please choose an artist on the main page.";
            return;
        }
        var name = ARTISTS[key][0];
        document.title = name + " – News | TVM artists";
        document.getElementById("pageTitle").textContent = name;
        document.getElementById("pageSub").textContent = "News";
        var back = document.getElementById("backLink");
        back.href = ARTISTS[key][1]; back.textContent = "← " + name;
        fetch("news-data/news.json", { cache: "no-cache" }).then(function (r) { return r.ok ? r.json() : []; })
        .then(function (all) {
            var items = (Array.isArray(all) ? all : []).filter(function (it) {
                return it && it.type === "article" && Array.isArray(it.cats) && it.cats.indexOf(key) !== -1;
            }).sort(function (a, b) { return String(b.ts || "").localeCompare(String(a.ts || "")); });
            if (!items.length) { list.appendChild(el("p", "empty", "No news yet.")); return; }
            items.forEach(function (it) { list.appendChild(entry(it)); });
        }).catch(function () { list.appendChild(el("p", "empty", "News could not be loaded.")); });
    })();
    </script>
</body>
</html>
