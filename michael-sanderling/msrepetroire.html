      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="none" id="none" hidden>No works match the filters.</div>
</div>

:"'The Seasons'"},{"c":"Haydn","t":"Nelson Mass","k":"Mass / Oratorio / Requiem","d":""},{"c":"Orff","t":"Carmina Burana","k":"Mass / Oratorio / Requiem","d":""},{"c":"Britten","t":"War Requiem","k":"Mass / Oratorio / Requiem","d":"Op. 66"},{"c":"Dvořák","t":"Requiem","k":"Mass / Oratorio / Requiem","d":"Op. 89"},{"c":"Dvořák","t":"Stabat Mater","k":"Mass / Oratorio / Requiem","d":"Op. 58"},{"c":"Rossini","t":"Stabat Mater","k":"Mass / Oratorio / Requiem","d":""},{"c":"Rossini","t":"Petite messe solennelle","k":"Mass / Oratorio / Requiem","d":""},{"c":"Elgar","t":"The Dream of Gerontius","k":"Mass / Oratorio / Requiem","d":"Op. 38"},{"c":"Mendelssohn","t":"Elijah","k":"Mass / Oratorio / Requiem","d":"Op. 70"},{"c":"Stravinsky","t":"Symphony of Psalms","k":"Mass / Oratorio / Requiem","d":""}];
const API = 'https://tvmartists.com/msrepertoire-notes.php';

// Stable key per work (composer + title), same on every device
function keyOf(w) {
  const s = w.c + '|' + w.t;
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < s.length; i++) { const ch = s.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
WORKS.forEach(w => { w.key = keyOf(w); });

const $ = (id) => document.getElementById(id);
const state = { sort: 'c', dir: 1, notes: {}, editable: false, unlocked: false, password: '' };
try { state.password = sessionStorage.getItem('msrep_pw') || ''; } catch (e) {}
const collator = new Intl.Collator('en', { sensitivity: 'base', numeric: true });
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function fillSelect(sel, values) {
  Array.from(new Set(values)).sort(collator.compare).forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o); });
}
fillSelect($('fk'), WORKS.map(w => w.k));
fillSelect($('fc'), WORKS.map(w => w.c));

function noteOf(w) { return (state.notes[w.key] && state.notes[w.key].t) || ''; }

function visibleWorks() {
  const q = $('q').value.trim().toLowerCase(), k = $('fk').value, c = $('fc').value, only = $('onlyc').checked;
  let list = WORKS.filter(w => (!k || w.k === k) && (!c || w.c === c) && (!only || noteOf(w))
    && (!q || (w.c + ' ' + w.t + ' ' + w.k + ' ' + w.d + ' ' + noteOf(w)).toLowerCase().includes(q)));
  const s = state.sort, d = state.dir;
  list.sort((a, b) => {
    let r;
    if (s === 'm') { const am = noteOf(a), bm = noteOf(b); r = (am ? 0 : 1) - (bm ? 0 : 1); if (!r) r = collator.compare(am, bm); }
    else r = collator.compare(a[s], b[s]);
    if (!r) r = collator.compare(a.c, b.c) || collator.compare(a.t, b.t);
    return r * d;
  });
  return list;
}

function render() {
  const list = visibleWorks();
  const body = $('rows'); body.innerHTML = '';
  const frag = document.createDocumentFragment();
  list.forEach(w => {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td class="comp">' + esc(w.c) + '</td><td>' + esc(w.t) + '</td><td class="cat">' + esc(w.k) + '</td><td class="det">' + esc(w.d) + '</td><td class="cm"><textarea rows="1" maxlength="2000" placeholder="' + (state.unlocked ? 'Add a note …' : '') + '"></textarea><div class="st"></div></td>';
    const ta = tr.querySelector('textarea'), st = tr.querySelector('.st');
    ta.value = noteOf(w);
    ta.readOnly = !state.unlocked;
    ta.addEventListener('input', () => grow(ta));
    ta.addEventListener('blur', () => save(w, ta, st));
    frag.appendChild(tr);
  });
  body.appendChild(frag);
  body.querySelectorAll('textarea').forEach(grow);
  $('count').textContent = list.length + ' of ' + WORKS.length + ' works' + (Object.keys(state.notes).length ? ' · ' + Object.keys(state.notes).length + ' with comment' : '');
  $('none').hidden = list.length > 0;
  $('tbl').hidden = list.length === 0;
  document.querySelectorAll('th').forEach(th => { th.querySelector('.ar').textContent = th.dataset.s === state.sort ? (state.dir > 0 ? '▲' : '▼') : ''; });
}
function grow(ta) { ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 2) + 'px'; }

async function save(w, ta, st) {
  if (!state.unlocked) return;
  const text = ta.value.trim();
  if (text === noteOf(w)) return;
  st.className = 'st'; st.textContent = 'Saving …';
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: w.key, text, password: state.password, meta: { c: w.c, w: w.t } }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) {
      st.className = 'st err'; st.textContent = j.error || 'Could not save.';
      if (r.status === 403) lockEditing('The password was not accepted. Please unlock again.');
      return;
    }
    if (text) state.notes[w.key] = { t: text, u: j.u }; else delete state.notes[w.key];
    st.className = 'st ok'; st.textContent = 'Saved ✓';
    setTimeout(() => { if (st.textContent === 'Saved ✓') st.textContent = ''; }, 2500);
  } catch (e) { st.className = 'st err'; st.textContent = 'No connection - not saved. Please try again.'; }
}

function setEditUi() {
  $('pw').hidden = state.unlocked || !state.editable;
  $('unlock').hidden = state.unlocked || !state.editable;
  $('lock').hidden = !state.unlocked;
  $('editstate').textContent = !state.editable ? 'Comments are read-only (editing is not set up yet).' : (state.unlocked ? 'Editing is unlocked. Changes are saved when you leave a comment field.' : 'Comments are read-only. Enter the password to edit.');
}
async function unlock() {
  const pw = $('pw').value || state.password;
  if (!pw) return;
  $('pwmsg').textContent = ''; $('pwmsg').className = 'msg';
  try {
    // a harmless test: saving an empty note for a non-existent key checks the password without changing anything
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ check: true, key: 'check0', text: '', password: pw }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { $('pwmsg').textContent = j.error || 'Password not accepted.'; state.unlocked = false; setEditUi(); render(); return; }
    state.password = pw; state.unlocked = true; $('pw').value = '';
    try { sessionStorage.setItem('msrep_pw', pw); } catch (e) {}
    setEditUi(); render();
  } catch (e) { $('pwmsg').textContent = 'No connection.'; }
}
function lockEditing(message) {
  state.unlocked = false; state.password = '';
  try { sessionStorage.removeItem('msrep_pw'); } catch (e) {}
  $('pwmsg').textContent = message || '';
  setEditUi(); render();
}

async function load() {
  try {
    const r = await fetch(API, { cache: 'no-store' });
    const j = await r.json();
    state.notes = j.notes || {}; state.editable = !!j.editable;
    setEditUi();
    if (state.editable && state.password) await unlock();
  } catch (e) {
    $('editstate').textContent = 'Comments could not be loaded. Please reload the page.';
  }
  render();
}

document.querySelectorAll('th').forEach(th => th.addEventListener('click', () => {
  const s = th.dataset.s; if (state.sort === s) state.dir = -state.dir; else { state.sort = s; state.dir = 1; }
  render();
}));
['q', 'fk', 'fc', 'onlyc'].forEach(id => $(id).addEventListener('input', render));
$('reset').addEventListener('click', () => { $('q').value = ''; $('fk').value = ''; $('fc').value = ''; $('onlyc').checked = false; render(); });
$('unlock').addEventListener('click', unlock);
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') unlock(); });
$('lock').addEventListener('click', () => lockEditing(''));
render(); load();
</script>
